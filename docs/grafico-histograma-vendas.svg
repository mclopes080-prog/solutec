<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Histograma das vendas mensais por categoria</title>
  <desc id="desc">Frequência de 24 observações: 1 unidade ocorreu 3 vezes, 2 unidades 9 vezes, 3 unidades 7 vezes, 4 unidades 3 vezes e 5 unidades 2 vezes.</desc>
  <rect width="800" height="460" rx="16" fill="#f7f9fc"/>
  <text x="55" y="48" font-family="Arial" font-size="22" font-weight="700" fill="#0b2340">Distribuição das vendas por categoria-mês</text>
  <text x="55" y="72" font-family="Arial" font-size="12" fill="#687b91">Histograma — 24 observações simuladas</text>
  <g stroke="#dce5ef"><path d="M80 360H750M80 300H750M80 240H750M80 180H750M80 120H750"/></g>
  <g font-family="Arial" font-size="12" fill="#6b7d90"><text x="58" y="364">0</text><text x="58" y="304">2</text><text x="58" y="244">4</text><text x="58" y="184">6</text><text x="58" y="124">8</text><text x="50" y="94">Frequência</text></g>
  <g fill="#168de9"><rect x="120" y="270" width="105" height="90"/><rect x="245" y="90" width="105" height="270"/><rect x="370" y="150" width="105" height="210"/><rect x="495" y="270" width="105" height="90"/><rect x="620" y="300" width="105" height="60"/></g>
  <g font-family="Arial" font-size="13" font-weight="700" fill="#0b69bb"><text x="168" y="258">3</text><text x="293" y="78">9</text><text x="418" y="138">7</text><text x="543" y="258">3</text><text x="668" y="288">2</text></g>
  <g font-family="Arial" font-size="12" fill="#6b7d90"><text x="168" y="390">1</text><text x="293" y="390">2</text><text x="418" y="390">3</text><text x="543" y="390">4</text><text x="668" y="390">5</text><text x="330" y="425">Unidades vendidas na categoria durante o mês</text></g>
</svg>
