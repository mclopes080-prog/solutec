<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
  <title id="title">Histograma das vendas mensais por categoria</title>
  <desc id="desc">Frequência de 24 observações: 1 unidade ocorreu 3 vezes, 2 unidades 10 vezes, 3 unidades 6 vezes, 4 unidades 3 vezes e 5 unidades 2 vezes.</desc>
  <rect width="800" height="460" rx="16" fill="#f7f9fc"/>
  <text x="55" y="48" font-family="Arial" font-size="22" font-weight="700" fill="#0b2340">Distribuição das vendas por categoria-mês</text>
  <text x="55" y="72" font-family="Arial" font-size="12" fill="#687b91">Histograma — 24 observações simuladas</text>
  <g stroke="#dce5ef"><path d="M80 360H750M80 310H750M80 260H750M80 210H750M80 160H750M80 110H750"/></g>
  <g font-family="Arial" font-size="12" fill="#6b7d90"><text x="58" y="364">0</text><text x="58" y="314">2</text><text x="58" y="264">4</text><text x="58" y="214">6</text><text x="58" y="164">8</text><text x="52" y="114">10</text><text x="50" y="96">Frequência</text></g>
  <g fill="#168de9"><rect x="120" y="285" width="105" height="75"/><rect x="245" y="110" width="105" height="250"/><rect x="370" y="210" width="105" height="150"/><rect x="495" y="285" width="105" height="75"/><rect x="620" y="310" width="105" height="50"/></g>
  <g font-family="Arial" font-size="13" font-weight="700" fill="#0b69bb"><text x="168" y="275">3</text><text x="289" y="100">10</text><text x="418" y="200">6</text><text x="543" y="275">3</text><text x="668" y="300">2</text></g>
  <g font-family="Arial" font-size="12" fill="#6b7d90"><text x="168" y="390">1</text><text x="293" y="390">2</text><text x="418" y="390">3</text><text x="543" y="390">4</text><text x="668" y="390">5</text><text x="330" y="425">Unidades vendidas na categoria durante o mês</text></g>
</svg>
